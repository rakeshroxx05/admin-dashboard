<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <h2>Admin</h2>
    <ul>
      <li onclick="showSection('home')">🏠 Dashboard</li>
      <li onclick="showSection('users')">👥 Users</li>
      <li onclick="showSection('reports')">📊 Reports</li>
      <li onclick="toggleTheme()">🌙 Dark Mode</li>
    </ul>
  </aside>

  <main class="main">
    <!-- Dashboard -->
    <section id="home" class="section">
      <h1>Dashboard</h1>
      <div class="cards">
        <div class="card">Total Users<br><span id="totalUsers">0</span></div>
        <div class="card">Active Users<br><span>12</span></div>
        <div class="card">Revenue<br><span>$540</span></div>
      </div>
    </section>

    <!-- Users -->
    <section id="users" class="section hidden">
      <h1>User Management</h1>
      <input type="text" id="username" placeholder="Enter username">
      <button onclick="addUser()">Add User</button>

      <ul id="userList"></ul>
    </section>

    <!-- Reports -->
    <section id="reports" class="section hidden">
      <h1>Reports</h1>
      <canvas id="chart" width="300" height="200"></canvas>
    </section>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
